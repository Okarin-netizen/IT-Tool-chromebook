<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文字数カウンター</title>
  <meta name="description" content="作文やレポートの字数を数えて、原稿用紙で何枚分かを出すブラウザだけで動くツール">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#4a6fa5">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="style.css">
  <style id="page-style">@page { size: A4 landscape; margin: 10mm; }</style>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><path d="M9 9h11v11H9z"/><path d="M5 15H4V4h11v1"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H4v-8h16v8h-3"/><path d="M7 14h10v7H7z"/></symbol>
  </svg>
  <header class="toolbar">
    <div class="group">
      <a class="btn back" href="../" title="ツール一覧に戻る" aria-label="ツール一覧に戻る"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg></a>
      <span class="app-title">文字数カウンター</span>
    </div>
    <div class="group tabs" role="tablist" aria-label="見かた">
      <button class="tab" role="tab" data-pane="count" aria-selected="true">数える</button>
      <button class="tab" role="tab" data-pane="paper" aria-selected="false">原稿用紙で見る</button>
    </div>
    <div class="group end">
      <button id="copy-btn" class="btn" title="文章をコピーして、ドキュメントなどに貼り付ける"><svg class="i" aria-hidden="true"><use href="#i-copy"/></svg>コピー</button>
      <button id="clear-btn" class="btn"><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg>全部消す</button>
      <button id="print-btn" class="btn primary" hidden><svg class="i" aria-hidden="true"><use href="#i-print"/></svg>印刷</button>
    </div>
  </header>

  <main id="count-pane" class="layout pane">
    <section class="editor" aria-label="文章">
      <textarea id="text" spellcheck="false" placeholder="ここに作文やレポートの文章を書くか、貼り付けます。&#10;書いた文章はこのパソコンのブラウザに自動で残り、どこにも送信されません。"></textarea>
    </section>

    <aside class="panel" aria-label="数えた結果">
      <div class="big">
        <span class="big-label">文字数</span>
        <output id="count-main" class="big-number">0</output><span class="big-unit">字</span>
        <span class="big-note">空白と改行は数えません</span>
      </div>

      <div class="target">
        <span class="label">目標の字数</span>
        <div class="target-inputs">
          <input id="target-min" type="number" min="0" step="10" inputmode="numeric" aria-label="何字以上">
          <span>字以上</span>
          <input id="target-max" type="number" min="0" step="10" inputmode="numeric" aria-label="何字以内">
          <span>字以内</span>
        </div>
        <div id="target-bar" class="bar" hidden><span id="target-fill"></span></div>
        <p id="target-text" class="target-text" hidden></p>
      </div>

      <dl class="stats">
        <dt>空白もふくめる</dt><dd id="count-spaces">0字</dd>
        <dt>句読点・記号を除く</dt><dd id="count-letters">0字</dd>
        <dt>原稿用紙（400字）</dt><dd id="count-paper">0枚</dd>
        <dt>行の数・段落の数</dt><dd id="count-lines">0行・0段落</dd>
        <dt>英単語の数</dt><dd id="count-words">0語</dd>
        <dt>声に出して読むと</dt><dd id="count-read">0秒</dd>
      </dl>
      <p class="note">原稿用紙は、1行20字・20行で数えます。改行したところは次の行に、行の頭に来る「、」「。」は前の行の最後のマスに入れます。</p>
    </aside>
  </main>

  <main id="paper-pane" class="paper-view pane" hidden>
    <div class="paper-options">
      <div class="tabs small" role="radiogroup" aria-label="書く向き">
        <button class="tab" role="radio" data-vertical="true" aria-checked="true">縦書き</button>
        <button class="tab" role="radio" data-vertical="false" aria-checked="false">横書き</button>
      </div>
      <label class="field check"><input id="indent" type="checkbox" checked>段落のはじめを1マス空ける</label>
      <span id="paper-info" class="paper-info"></span>
    </div>
    <div id="sheets" class="sheets"></div>
  </main>

  <div id="status" class="status" role="status" aria-live="polite" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
