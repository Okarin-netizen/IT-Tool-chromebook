<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>時間割・課題チェックリスト</title>
  <meta name="description" content="時間割と課題をブラウザに保存して管理できるツール">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#2b8463">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></symbol>
  </svg>
  <header class="toolbar">
    <div class="group">
      <a class="btn back" href="../" title="ツール一覧に戻る" aria-label="ツール一覧に戻る"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg></a>
      <h1 class="title">時間割・課題</h1>
    </div>
    <div class="group end">
      <button id="export-btn" class="btn" title="データをファイルに保存（バックアップ）"><svg class="i" aria-hidden="true"><use href="#i-save"/></svg>バックアップ</button>
      <label class="btn" for="import-input" title="バックアップしたファイルから読み込む"><svg class="i" aria-hidden="true"><use href="#i-upload"/></svg>読み込み</label>
      <input id="import-input" type="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="tt-heading">
      <div class="panel-head">
        <h2 id="tt-heading">時間割</h2>
        <div class="group">
          <label class="field">時間数
            <select id="period-count">
              <option>4</option><option>5</option><option>6</option><option>7</option><option>8</option>
            </select>
          </label>
          <label class="field check"><input id="show-sat" type="checkbox"> 土曜</label>
        </div>
      </div>
      <div class="tt-wrap">
        <table id="timetable" class="timetable"></table>
      </div>
      <p class="hint">マスをクリックして科目を入力します。今日の列は色が付きます。</p>
    </section>

    <section class="panel" aria-labelledby="task-heading">
      <div class="panel-head">
        <h2 id="task-heading">課題</h2>
        <div class="group" role="radiogroup" aria-label="表示する課題">
          <button class="chip selected" data-filter="open">未完了</button>
          <button class="chip" data-filter="done">完了</button>
          <button class="chip" data-filter="all">すべて</button>
        </div>
      </div>

      <form id="task-form" class="task-form" autocomplete="off">
        <input id="task-title" class="input grow" placeholder="課題の内容（例: 数学ワークp.20〜25）" required>
        <input id="task-subject" class="input subject" placeholder="科目" list="subject-list">
        <datalist id="subject-list"></datalist>
        <input id="task-due" class="input" type="date" title="締め切り">
        <button class="btn primary" type="submit">＋ 追加</button>
      </form>

      <ul id="task-list" class="task-list"></ul>
      <p id="task-empty" class="empty" hidden></p>
      <div class="list-foot">
        <span id="task-count" class="muted"></span>
        <button id="clear-done" class="btn small" hidden>完了した課題を消す</button>
      </div>
    </section>
  </main>

  <p class="note">データはこのブラウザの中だけに保存され、どこにも送信されません。別の端末で使うときや、念のための保存には「バックアップ」を使ってください。</p>

  <div id="status" class="status" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
