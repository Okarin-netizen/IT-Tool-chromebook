<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>授業の画面</title>
  <meta name="description" content="声の大きさメーター・信号・サイコロ・得点板を、教室のスクリーンに大きく映せるブラウザだけで動くツール">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#9c36b5">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/><circle cx="12" cy="12" r="1"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  </svg>
  <header class="toolbar">
    <div class="group">
      <a class="btn back" href="../" title="ツール一覧に戻る" aria-label="ツール一覧に戻る"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg></a>
      <span class="app-title">授業の画面</span>
    </div>
    <div class="tabs" role="tablist" aria-label="画面">
      <button class="tab" role="tab" data-mode="meter" aria-selected="true">声の大きさ</button>
      <button class="tab" role="tab" data-mode="signal" aria-selected="false">信号</button>
      <button class="tab" role="tab" data-mode="dice" aria-selected="false">サイコロ</button>
      <button class="tab" role="tab" data-mode="score" aria-selected="false">得点板</button>
    </div>
    <div class="group end">
      <button id="fullscreen-btn" class="btn icon" title="全画面表示（F）" aria-label="全画面表示"><svg class="i" aria-hidden="true"><use href="#i-fullscreen"/></svg></button>
    </div>
  </header>

  <main id="meter" class="view">
    <p id="meter-word" class="meter-word">「マイクを使う」を押してください</p>
    <div class="meter" aria-hidden="true">
      <div id="meter-bar" class="meter-bar"></div>
      <div id="meter-limit-line" class="meter-limit-line"></div>
    </div>
    <p id="meter-count" class="count"></p>
    <div class="controls">
      <button id="mic-btn" class="btn primary big"><svg class="i" aria-hidden="true"><use href="#i-mic"/></svg><span id="mic-label">マイクを使う</span></button>
      <button id="meter-reset" class="btn"><svg class="i" aria-hidden="true"><use href="#i-reset"/></svg>回数を0に</button>
    </div>
    <div class="controls">
      <label class="field">ここまで（線の位置）<input id="meter-limit" type="range" min="20" max="95" step="5"></label>
      <label class="field">マイクの感度<input id="meter-sensitivity" type="range" min="1" max="10" step="1"></label>
    </div>
    <p class="note">マイクの音は、その場で大きさを測るだけです。録音も送信もしません。</p>
  </main>

  <main id="signal" class="view" hidden>
    <div class="signal" role="radiogroup" aria-label="信号">
      <button class="light red" data-light="0" role="radio" aria-checked="false"><span class="lamp"></span><span class="light-label"></span></button>
      <button class="light yellow" data-light="1" role="radio" aria-checked="false"><span class="lamp"></span><span class="light-label"></span></button>
      <button class="light green" data-light="2" role="radio" aria-checked="false"><span class="lamp"></span><span class="light-label"></span></button>
    </div>
    <details class="signal-words">
      <summary>ことばを変える</summary>
      <label class="field">赤 <input class="signal-input" data-light="0" type="text" maxlength="12"></label>
      <label class="field">黄 <input class="signal-input" data-light="1" type="text" maxlength="12"></label>
      <label class="field">緑 <input class="signal-input" data-light="2" type="text" maxlength="12"></label>
    </details>
    <p class="note">ランプをクリックするか、キーボードの 1・2・3 で切りかえます。もう一度押すと消えます。</p>
  </main>

  <main id="dice" class="view" hidden>
    <div id="dice-faces" class="dice-faces" aria-live="polite"></div>
    <p id="dice-total" class="dice-total"></p>
    <div class="controls">
      <button id="roll-btn" class="btn primary big" title="サイコロを振る（スペースキー）"><svg class="i" aria-hidden="true"><use href="#i-dice"/></svg>振る</button>
      <label class="field">個数
        <select id="dice-count">
          <option value="1">1個</option>
          <option value="2">2個</option>
          <option value="3">3個</option>
          <option value="4">4個</option>
          <option value="5">5個</option>
          <option value="6">6個</option>
        </select>
      </label>
    </div>
  </main>

  <main id="score" class="view" hidden>
    <ol id="teams" class="teams"></ol>
    <div class="controls">
      <button id="team-add" class="btn"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>チームを増やす</button>
      <label class="field">1回で
        <select id="score-step">
          <option value="1">1点</option>
          <option value="2">2点</option>
          <option value="5">5点</option>
          <option value="10">10点</option>
        </select>
      </label>
      <button id="score-reset" class="btn"><svg class="i" aria-hidden="true"><use href="#i-reset"/></svg>全部0点に</button>
    </div>
    <p class="note">チームの名前はクリックして書きかえられます。点数はこのブラウザに残ります。</p>
  </main>

  <div id="status" class="status" role="status" aria-live="polite" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
