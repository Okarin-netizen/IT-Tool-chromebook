<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校庭・体育館の配置図</title>
  <meta name="description" content="運動会・入学式・卒業式など行事の説明書に載せる校庭や体育館の配置図を、コーン・いす・ステージ・矢印などを置いて作るブラウザだけで動くツール">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#3d7d2b">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/></symbol>
    <symbol id="i-bw" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M4 19V6a1 1 0 0 1 1-1h4l2 2h7a1 1 0 0 1 1 1v2"/><path d="M4 19l3-8h14l-3 8z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></symbol>
    <symbol id="i-page" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></symbol>
    <symbol id="i-pages" viewBox="0 0 24 24"><path d="M8 3h8l4 4v12H8z"/><path d="M4 7v14h11"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-new" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M12 10v6M9 13h6"/></symbol>
    <symbol id="i-pointer" viewBox="0 0 24 24"><path d="M6 3l12 8-5.5 1.2L10 18z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
  </svg>
  <header class="toolbar">
    <div class="group">
      <a class="btn back" href="../" title="ツール一覧に戻る" aria-label="ツール一覧に戻る"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg></a>
      <span class="app-title">校庭・体育館の配置図</span>
      <button id="undo-btn" class="btn" title="元に戻す (Ctrl+Z)" disabled><svg class="i" aria-hidden="true"><use href="#i-undo"/></svg>元に戻す</button>
      <button id="redo-btn" class="btn" title="やり直し (Ctrl+Y)" disabled><svg class="i" aria-hidden="true"><use href="#i-redo"/></svg>やり直し</button>
      <button id="snap-btn" class="btn tool" aria-pressed="true" title="置いたものを1mのます目にそろえる。5mごとに薄い線が出ます（印刷には出ません）"><svg class="i" aria-hidden="true"><use href="#i-grid"/></svg>ます目にそろえる</button>
      <button id="bw-btn" class="btn tool" aria-pressed="false" title="色を使わず、白黒で印刷してもよく分かる図にする（保存する図も白黒になります）"><svg class="i" aria-hidden="true"><use href="#i-bw"/></svg>白黒印刷</button>
    </div>
    <div class="group end">
      <div class="menu-wrap">
        <button id="more-btn" class="btn more" aria-haspopup="true" aria-expanded="false" title="つづきのファイル・全部消す">その他 ▾</button>
        <div id="more-menu" class="more-menu right" hidden>
          <label class="btn" for="open-input" title="前に「つづきを保存」したファイルを開く"><svg class="i" aria-hidden="true"><use href="#i-open"/></svg>つづきを開く</label>
          <button id="save-data-btn" class="btn" title="あとで続きを作れるファイル（.json）を保存。ほかの端末や先生どうしで受け渡せます"><svg class="i" aria-hidden="true"><use href="#i-save"/></svg>つづきを保存</button>
          <button id="clear-figure-btn" class="btn"><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg>この図を空にする</button>
          <button id="new-doc-btn" class="btn" title="全部の図を消して、はじめから作る（「元に戻す」で戻せます）"><svg class="i" aria-hidden="true"><use href="#i-new"/></svg>はじめから作る</button>
        </div>
      </div>
      <input id="open-input" type="file" accept=".json,application/json" hidden>
      <div class="menu-wrap">
        <button id="save-btn" class="btn primary" aria-haspopup="true" aria-expanded="false"><svg class="i" aria-hidden="true"><use href="#i-save"/></svg>図を保存 ▾</button>
        <div id="save-menu" class="more-menu right" hidden>
          <button id="save-png-btn" class="btn"><svg class="i" aria-hidden="true"><use href="#i-image"/></svg>この図を画像（PNG）で保存</button>
          <button id="copy-btn" class="btn" title="Googleドキュメントやスライドに Ctrl+V で貼り付けられます"><svg class="i" aria-hidden="true"><use href="#i-copy"/></svg>この図をコピー（説明書に貼る）</button>
          <button id="save-pdf-btn" class="btn"><svg class="i" aria-hidden="true"><use href="#i-page"/></svg>この図をPDFで保存</button>
          <button id="save-all-btn" class="btn" title="図を1枚ずつA4のページにしたPDF"><svg class="i" aria-hidden="true"><use href="#i-pages"/></svg>全部の図をPDFで保存</button>
        </div>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="palette" aria-label="置くもの">
      <button id="select-tool" class="tile wide" data-tool="select" aria-pressed="true" title="選んで動かす (Esc)"><svg class="i" aria-hidden="true"><use href="#i-pointer"/></svg>選ぶ・動かす</button>
      <div id="palette"></div>
    </aside>

    <section class="stage" aria-label="配置図">
      <div id="board-wrap" class="board-wrap">
        <svg id="board" class="board" lang="ja" role="img" aria-label="配置図"></svg>
      </div>
      <div class="pages">
        <div id="tabs" class="tabs" role="tablist" aria-label="図（種目ごと）"></div>
        <button id="add-figure-btn" class="btn small" title="種目ごとの図を足す。「全体の配置」のテントや席は、どの図にも出ます"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>図を足す</button>
        <div class="zoom" role="group" aria-label="拡大">
          <button id="zoom-out" class="btn icon small" title="小さく" aria-label="小さく"><svg class="i" aria-hidden="true"><use href="#i-minus"/></svg></button>
          <span id="zoom-text" class="zoom-text">100%</span>
          <button id="zoom-in" class="btn icon small" title="大きく（Ctrl＋ホイールでも）" aria-label="大きく"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button>
          <button id="zoom-fit" class="btn icon small" title="全体を見る" aria-label="全体を見る"><svg class="i" aria-hidden="true"><use href="#i-fit"/></svg></button>
        </div>
      </div>
    </section>

    <aside id="panel" class="panel" aria-label="設定"></aside>
  </main>

  <div id="status" class="status" role="status" aria-live="polite" hidden></div>
  <div id="drop-overlay" class="drop-overlay" hidden>ここに「つづき」のファイルをドロップ</div>

  <script type="module" src="app.js"></script>
</body>
</html>
