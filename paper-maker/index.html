<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方眼紙・罫線プリント</title>
  <meta name="description" content="方眼紙・罫線・英語の4線・漢字のマス・座標・五線譜を、印刷できるPDFにするブラウザだけで動くツール">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#6b7d2a">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  </svg>
  <header class="toolbar">
    <div class="group">
      <a class="btn back" href="../" title="ツール一覧に戻る" aria-label="ツール一覧に戻る"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg></a>
      <span class="app-title">方眼紙・罫線プリント</span>
    </div>
    <div class="group end">
      <button id="save-btn" class="btn primary"><svg class="i" aria-hidden="true"><use href="#i-save"/></svg>PDFで保存</button>
    </div>
  </header>

  <main class="layout">
    <section class="form" aria-label="用紙の選び方">
      <span class="label">種類</span>
      <div id="kinds" class="kinds" role="radiogroup" aria-label="種類"></div>

      <label class="field">大きさ<select id="size"></select></label>

      <div class="row">
        <label class="field">紙
          <select id="paper">
            <option value="A4">A4</option>
            <option value="B5">B5</option>
            <option value="B4">B4</option>
            <option value="A3">A3</option>
          </select>
        </label>
        <div class="tabs" role="radiogroup" aria-label="紙の向き">
          <button class="tab" role="radio" data-landscape="false" aria-checked="true">縦</button>
          <button class="tab" role="radio" data-landscape="true" aria-checked="false">横</button>
        </div>
      </div>

      <div class="row">
        <span class="field-label">線の色</span>
        <div class="tabs" role="radiogroup" aria-label="線の色">
          <button class="tab" role="radio" data-color="gray" aria-checked="true">灰色</button>
          <button class="tab" role="radio" data-color="blue" aria-checked="false">水色</button>
          <button class="tab" role="radio" data-color="black" aria-checked="false">黒</button>
        </div>
      </div>

      <label class="field check"><input id="name-line" type="checkbox">上に「年・組・番・名前」の欄を入れる</label>
      <label class="label" for="title">上に入れる題名（なくてもOK）</label>
      <input id="title" type="text" maxlength="40" placeholder="例: 一次関数のグラフ" autocomplete="off">
      <p class="note">PDFを開いて印刷します。印刷の画面で「倍率」を「実際のサイズ（100%）」にすると、マスの大きさがそのとおりになります。</p>
    </section>

    <section class="preview-wrap" aria-label="見本">
      <canvas id="preview" class="preview" width="1" height="1"></canvas>
      <p id="info" class="info"></p>
    </section>
  </main>

  <div id="status" class="status" role="status" aria-live="polite" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
