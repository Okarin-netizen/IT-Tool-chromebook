<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新しいツール</title>
  <meta name="description" content="ツールの説明を1文で">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#3565c9">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  </svg>
  <header class="toolbar">
    <div class="group">
      <a class="btn back" href="../" title="ツール一覧に戻る" aria-label="ツール一覧に戻る"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg></a>
      <span class="app-title">新しいツール</span>
    </div>
    <div class="group">
      <label class="btn" for="file-input"><svg class="i" aria-hidden="true"><use href="#i-open"/></svg>ファイルを開く</label>
      <input id="file-input" type="file" hidden>
    </div>
    <div class="group end">
      <button id="save-btn" class="btn primary" disabled><svg class="i" aria-hidden="true"><use href="#i-save"/></svg>保存</button>
    </div>
  </header>

  <main>
    <section id="welcome" class="welcome">
      <h1>新しいツール</h1>
      <p>このツールでできることを書きます。</p>
      <p class="note">ファイルはどこにも送信されず、ブラウザ内で処理されます。</p>
    </section>
  </main>

  <div id="status" class="status" role="status" aria-live="polite" hidden></div>
  <div id="drop-overlay" class="drop-overlay" hidden>ここにファイルをドロップ</div>

  <script type="module" src="app.js"></script>
</body>
</html>
