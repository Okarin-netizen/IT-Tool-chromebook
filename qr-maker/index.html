<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QRコード作成</title>
  <meta name="description" content="URLや文字からQRコードの画像を作るブラウザだけで動くツール">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#475569">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><path d="M9 9h11v11H9z"/><path d="M5 15H4V4h11v1"/></symbol>
  </svg>
  <header class="toolbar">
    <div class="group">
      <a class="btn back" href="../" title="ツール一覧に戻る" aria-label="ツール一覧に戻る"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg></a>
      <span class="app-title">QRコード作成</span>
    </div>
    <div class="group end">
      <button id="copy-btn" class="btn" disabled title="画像をコピーして、ドキュメントやスライドに貼り付ける"><svg class="i" aria-hidden="true"><use href="#i-copy"/></svg>コピー</button>
      <button id="save-btn" class="btn primary" disabled><svg class="i" aria-hidden="true"><use href="#i-save"/></svg>PNGで保存</button>
    </div>
  </header>

  <main class="layout">
    <section class="form" aria-label="QRコードの中身">
      <label class="label" for="text">URLや文字</label>
      <textarea id="text" rows="4" spellcheck="false" placeholder="https://classroom.google.com/…&#10;Googleフォームの回答URLや、配りたい文章を入れます"></textarea>
      <label class="label" for="caption">下に入れる文字（なくてもOK）</label>
      <input id="caption" type="text" placeholder="例: アンケートはこちら" autocomplete="off">
      <div class="row">
        <label class="field">読み取りやすさ
          <select id="ecc">
            <option value="L">低（小さい）</option>
            <option value="M" selected>ふつう</option>
            <option value="Q">高</option>
            <option value="H">最高（汚れに強い）</option>
          </select>
        </label>
        <label class="field">画像の大きさ
          <select id="size">
            <option value="256">小</option>
            <option value="512" selected>中</option>
            <option value="1024">大（印刷向け）</option>
          </select>
        </label>
      </div>
      <p class="note">QRコードはこのパソコンの中で作られ、入れた文字はどこにも送信されません。日本語の文字も入れられます。</p>
    </section>

    <section class="preview-wrap" aria-label="できあがり">
      <canvas id="preview" class="preview" width="1" height="1"></canvas>
      <p id="info" class="info">左にURLや文字を入れると、ここにQRコードができます。</p>
    </section>
  </main>

  <div id="status" class="status" role="status" aria-live="polite" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
