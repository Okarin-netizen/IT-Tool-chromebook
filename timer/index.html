<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タイマー・ポモドーロ</title>
  <meta name="description" content="勉強時間やテスト練習の時間を計れる、ブラウザだけで動くタイマー">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#c03a2a">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-bell-off" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/><path d="M4 4l16 16"/></symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></symbol>
    <symbol id="i-skip" viewBox="0 0 24 24"><path d="M6 5l9 7-9 7z"/><path d="M18 5v14"/></symbol>
  </svg>
  <header class="toolbar">
    <div class="group">
      <a class="btn back" href="../" title="ツール一覧に戻る" aria-label="ツール一覧に戻る"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg></a>
      <span class="app-title">タイマー・ポモドーロ</span>
    </div>

    <div class="tabs" role="tablist" aria-label="モード">
      <button class="tab" role="tab" data-mode="pomodoro">ポモドーロ</button>
      <button class="tab" role="tab" data-mode="timer">タイマー</button>
      <button class="tab" role="tab" data-mode="stopwatch">ストップウォッチ</button>
    </div>

    <div class="group end">
      <button id="sound-btn" class="btn icon" title="音のオン・オフ"><svg class="i" aria-hidden="true"><use href="#i-bell"/></svg></button>
      <button id="fullscreen-btn" class="btn icon" title="全画面表示（F）"><svg class="i" aria-hidden="true"><use href="#i-fullscreen"/></svg></button>
    </div>
  </header>

  <main class="stage">
    <p id="phase" class="phase"></p>

    <div class="dial">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle class="track" cx="100" cy="100" r="90"/>
        <circle id="ring" class="ring" cx="100" cy="100" r="90"/>
      </svg>
      <div id="display" class="display" role="timer" aria-live="off">25:00</div>
    </div>

    <!-- タイマー: 時間の設定 -->
    <section id="timer-setup" class="setup" hidden>
      <div class="presets" id="presets"></div>
      <div class="custom">
        <label class="field"><input id="custom-min" type="number" min="0" max="999" value="10" inputmode="numeric"> 分</label>
        <label class="field"><input id="custom-sec" type="number" min="0" max="59" value="0" inputmode="numeric"> 秒</label>
        <button id="custom-set" class="btn">セット</button>
      </div>
    </section>

    <div class="controls">
      <button id="start-btn" class="btn primary big">スタート</button>
      <button id="reset-btn" class="btn big"><svg class="i" aria-hidden="true"><use href="#i-reset"/></svg>リセット</button>
      <button id="skip-btn" class="btn big" title="次の時間へ進む"><svg class="i" aria-hidden="true"><use href="#i-skip"/></svg>スキップ</button>
      <button id="lap-btn" class="btn big">ラップ</button>
    </div>

    <!-- ポモドーロ: 進み具合と設定 -->
    <section id="pomodoro-info" class="info" hidden>
      <div id="dots" class="dots" aria-label="今のセットの進み具合"></div>
      <p class="today">今日の集中: <strong id="today-count">0</strong> 回（<span id="today-min">0</span> 分）</p>
      <details class="settings">
        <summary>時間の設定</summary>
        <div class="settings-grid">
          <label class="field">集中 <input id="set-work" type="number" min="1" max="180"> 分</label>
          <label class="field">休憩 <input id="set-short" type="number" min="1" max="60"> 分</label>
          <label class="field">長い休憩 <input id="set-long" type="number" min="1" max="120"> 分</label>
          <label class="field">長い休憩までの回数 <input id="set-rounds" type="number" min="2" max="10"> 回</label>
          <label class="check"><input id="set-auto" type="checkbox"> 次の時間を自動で始める</label>
        </div>
      </details>
    </section>

    <ol id="laps" class="laps" hidden></ol>

    <p class="hint">キーボード: <kbd>スペース</kbd> スタート/一時停止　<kbd>R</kbd> リセット　<kbd>F</kbd> 全画面</p>
  </main>

  <div id="status" class="status" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
  <script type="module">
    // Keeps this tool working without a network once it has been opened.
    import { registerOffline } from "../shared/js/offline.js";
    registerOffline(["./", "index.html", "style.css", "app.js", "icon.svg", "manifest.webmanifest"]);
  </script>
</body>
</html>
