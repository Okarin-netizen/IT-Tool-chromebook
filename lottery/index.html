<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>くじ引き</title>
  <meta name="description" content="ルーレット・あみだくじ・めくるくじ・順番決めで、係や順番をくじで決めるブラウザだけで動くツール">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#c2255c">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M4 7h3c5 0 5 10 10 10h3M4 17h3c2 0 3-1.5 4-3.5M13 9.5c1-2 2-2.5 4-2.5h3M17 4l3 3-3 3M17 14l3 3-3 3"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24"><path d="M12 3v18M8 7L3 12l5 5zM16 7l5 5-5 5z"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M3 12s3-6 9-6 9 6 9 6-3 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-hide" viewBox="0 0 24 24"><path d="M3 12s3-6 9-6 9 6 9 6-3 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/><path d="M4 4l16 16"/></symbol>
  </svg>
  <header class="toolbar">
    <div class="group">
      <a class="btn back" href="../" title="ツール一覧に戻る" aria-label="ツール一覧に戻る"><svg class="i" aria-hidden="true"><use href="#i-back"/></svg></a>
      <span class="app-title">くじ引き</span>
    </div>
    <div class="tabs" role="tablist" aria-label="くじの種類">
      <button class="tab" role="tab" data-mode="wheel" aria-selected="true">ルーレット</button>
      <button class="tab" role="tab" data-mode="amida" aria-selected="false">あみだくじ</button>
      <button class="tab" role="tab" data-mode="cards" aria-selected="false">めくるくじ</button>
      <button class="tab" role="tab" data-mode="order" aria-selected="false">順番決め</button>
    </div>
    <div class="group end">
      <button id="fullscreen-btn" class="btn icon" title="全画面表示（F）" aria-label="全画面表示"><svg class="i" aria-hidden="true"><use href="#i-fullscreen"/></svg></button>
    </div>
  </header>

  <div class="layout">
    <aside class="items-panel" aria-label="くじの中身">
      <label for="items" class="panel-label"><span id="items-label">くじの中身（1行に1つ）</span><span id="count" class="count"></span></label>
      <textarea id="items" spellcheck="false" placeholder="給食当番&#10;そうじ当番&#10;黒板係&#10;…&#10;&#10;名前・係・番号・食べたいものなど、何でも入れられます"></textarea>
      <div class="quick">
        <p class="quick-title">かんたんに入れる</p>
        <div class="quick-row">
          <label class="field">1から <input id="number-max" type="number" min="2" max="100" value="10" inputmode="numeric"> までの番号</label>
        </div>
        <button id="fill-numbers" class="btn">番号を入れる</button>
        <div class="quick-row">
          <label class="field">当たり <input id="win-count" type="number" min="1" max="50" value="1" inputmode="numeric"></label>
          <label class="field">はずれ <input id="lose-count" type="number" min="0" max="99" value="9" inputmode="numeric"></label>
        </div>
        <button id="fill-wins" class="btn">当たり・はずれを入れる</button>
      </div>
      <p class="note">中身はこのブラウザの中だけに保存され、どこにも送信されません。</p>
    </aside>

    <main id="wheel" class="view">
      <div class="wheel-area">
        <div class="wheel-box">
          <canvas id="wheel-canvas" aria-label="ルーレット" role="img"></canvas>
          <div class="wheel-pointer" aria-hidden="true"></div>
        </div>
      </div>
      <div class="wheel-side">
        <div id="wheel-result" class="result" aria-live="polite">左の欄に中身を入れて「回す」</div>
        <button id="spin-btn" class="btn primary big" title="ルーレットを回す（スペースキー）"><svg class="i" aria-hidden="true"><use href="#i-play"/></svg>回す</button>
        <div class="options">
          <label class="check"><input id="remove-picked" type="checkbox"> 当たったものは外す</label>
          <label class="check"><input id="sound" type="checkbox"> 音を出す</label>
        </div>
        <section class="history-wrap" aria-labelledby="history-title">
          <div class="history-head">
            <h2 id="history-title">当たったもの</h2>
            <button id="wheel-reset" class="btn small"><svg class="i" aria-hidden="true"><use href="#i-reset"/></svg>最初から</button>
          </div>
          <ol id="history" class="history"></ol>
        </section>
      </div>
    </main>

    <main id="amida" class="view" hidden>
      <div class="amida-bar">
        <button id="amida-all" class="btn primary" title="上の名前を1つずつ順にたどる（スペースキー）"><svg class="i" aria-hidden="true"><use href="#i-play"/></svg>全部たどる</button>
        <button id="amida-new" class="btn"><svg class="i" aria-hidden="true"><use href="#i-shuffle"/></svg>線を引きなおす</button>
        <button id="amida-show" class="btn" aria-pressed="false"><svg class="i" aria-hidden="true"><use href="#i-eye"/></svg>下を見せる</button>
        <details id="goals-box" class="goals-box">
          <summary>下に書くこと</summary>
          <div class="goals-pop">
            <label for="goals" class="panel-label">下に書くこと（1行に1つ）</label>
            <textarea id="goals" class="small-text" spellcheck="false" placeholder="当たり&#10;はずれ&#10;…"></textarea>
            <p class="note">何も書かないときは 1, 2, 3… の番号になります。足りない所は「はずれ」になります。</p>
          </div>
        </details>
      </div>
      <p id="amida-note" class="note">上の名前を押すと、線をたどって行き先が分かります。始める前なら、たての線の間をクリックして横線を足せます。</p>
      <div id="amida-board" class="amida-board">
        <div id="amida-top" class="amida-labels top"></div>
        <svg id="amida-svg" class="amida-svg" preserveAspectRatio="none" aria-label="あみだくじ" role="img"></svg>
        <div id="amida-bottom" class="amida-labels bottom"></div>
      </div>
    </main>

    <main id="cards" class="view" hidden>
      <div class="cards-bar">
        <button id="cards-shuffle" class="btn primary"><svg class="i" aria-hidden="true"><use href="#i-shuffle"/></svg>まぜなおす</button>
        <button id="cards-open-all" class="btn"><svg class="i" aria-hidden="true"><use href="#i-flip"/></svg>全部めくる</button>
        <span id="cards-left" class="count"></span>
      </div>
      <p class="note">カードを押すとめくれます。中身はまぜてから配っているので、どのカードに何が入っているかは分かりません。</p>
      <ol id="card-grid" class="card-grid"></ol>
    </main>

    <main id="order" class="view" hidden>
      <div class="cards-bar">
        <button id="order-btn" class="btn primary" title="順番を決める（スペースキー）"><svg class="i" aria-hidden="true"><use href="#i-shuffle"/></svg>順番を決める</button>
        <button id="order-copy" class="btn" disabled title="順番をコピーして、ドキュメントやClassroomに貼り付ける"><svg class="i" aria-hidden="true"><use href="#i-copy"/></svg>コピー</button>
      </div>
      <p class="note">左の中身を全部、ランダムな順番に並べます。発表の順番や、走る順番を決めるときに。</p>
      <ol id="order-list" class="order-list"></ol>
    </main>
  </div>

  <div id="status" class="status" role="status" aria-live="polite" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
