<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>画像→PDF</title>
  <meta name="description" content="写真や画像を1つのPDFにまとめるブラウザだけで動くツール">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0f766e">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <div class="group">
      <a class="btn" href="../" title="ツール一覧に戻る">← 一覧</a>
      <label class="btn primary" for="file-input">🖼 画像を追加</label>
      <input id="file-input" type="file" accept="image/*" multiple hidden>
      <button id="camera-btn" class="btn" title="カメラで撮影して追加">📷 カメラで撮る</button>
    </div>

    <div class="group" role="group" aria-label="PDFの設定">
      <label class="field">用紙
        <select id="page-size">
          <option value="a4" selected>A4</option>
          <option value="b5">B5</option>
          <option value="letter">レター</option>
          <option value="fit">画像に合わせる</option>
        </select>
      </label>
      <label class="field">向き
        <select id="orientation">
          <option value="auto" selected>自動</option>
          <option value="portrait">縦</option>
          <option value="landscape">横</option>
        </select>
      </label>
      <label class="field">余白
        <select id="margin">
          <option value="0">なし</option>
          <option value="20" selected>小</option>
          <option value="40">大</option>
        </select>
      </label>
      <label class="field">色
        <select id="color-mode">
          <option value="color" selected>カラー</option>
          <option value="gray">白黒（書類向け）</option>
        </select>
      </label>
    </div>

    <div class="group">
      <button id="sort-btn" class="btn" disabled title="ファイル名の順に並べる">↕ 名前順</button>
      <button id="clear-btn" class="btn" disabled title="すべての画像を外す">🗑 全部消す</button>
    </div>

    <div class="group end">
      <label class="field">ファイル名
        <input id="file-name" type="text" value="まとめ" size="12" autocomplete="off">
      </label>
      <button id="save-btn" class="btn primary" disabled>💾 PDFを保存</button>
    </div>
  </header>

  <main id="viewer" class="viewer">
    <section id="welcome" class="welcome">
      <h1>画像→PDF</h1>
      <p>ノートやプリントの写真を、1つのPDFにまとめて保存できます。</p>
      <ol>
        <li>「🖼 画像を追加」を押すか、画像をここにドラッグします（何枚でもOK）。</li>
        <li>「📷 カメラで撮る」で、その場で撮影して追加することもできます。</li>
        <li>画像をドラッグするか「◀ ▶」で順番を入れ替えます。「⟳」で90°回転します。</li>
        <li>用紙・向き・余白を選んで「💾 PDFを保存」を押すと、1枚1ページのPDFができます。</li>
      </ol>
      <p class="note">画像はこのパソコンの中だけで処理され、どこにも送信されません。</p>
    </section>
    <ol id="grid" class="grid" aria-label="ページの並び"></ol>
  </main>

  <dialog id="camera" class="camera">
    <video id="camera-video" autoplay playsinline muted></video>
    <div class="camera-bar">
      <button id="camera-switch" class="btn" title="前後のカメラを切り替える">🔄 切替</button>
      <button id="camera-shot" class="btn primary shot">● 撮影</button>
      <button id="camera-close" class="btn">完了</button>
    </div>
    <p id="camera-count" class="camera-count"></p>
  </dialog>

  <div id="status" class="status" role="status" aria-live="polite" hidden></div>
  <div id="drop-overlay" class="drop-overlay" hidden>ここに画像をドロップ</div>

  <script src="lib/pdf-lib.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
