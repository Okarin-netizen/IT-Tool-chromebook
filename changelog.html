<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="author" content="技術 岡田">
  <link rel="icon" href="pdf-text/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#f4f5f7">
  <link rel="stylesheet" href="shared/css/site.css">
</head>
<body>
  <aside class="side">
    <a class="logo" href="./">Chromebook<br>便利ツール</a>
    <nav aria-label="ツールのグループ">
      <ul class="nav">
        <li><a href="./">すべてのツール</a></li>
        <li><a href="./#fav">お気に入り</a></li>
        <li><a href="./#pdf">PDF</a></li>
        <li><a href="./#class">授業で使う</a></li>
        <li><a href="./#photo">写真・動画</a></li>
        <li><a href="./#other">そのほかのツール</a></li>
      </ul>
    </nav>
    <div class="sep"></div>
    <ul class="nav">
      <li><a class="page" href="changelog.html" aria-current="page">更新履歴</a></li>
      <li><a class="page" href="about.html">このサイトについて</a></li>
    </ul>
    <p class="meta">作成者　技術 岡田<br><a href="about.html#license">MIT License</a><br>最終更新　<span class="updated"></span></p>
  </aside>

  <main>
    <div class="top">
      <h1>更新履歴</h1>
      <p>ツールを足したり、できることを増やしたりした記録です。新しいものが上です。</p>
    </div>
    <table class="log"><tbody id="log"></tbody></table>
  </main>

  <script type="module">
    import { registerOffline } from "./shared/js/offline.js";
    import { CHANGELOG, LAST_UPDATED, formatDate } from "./shared/js/changelog.js";
    registerOffline(["./", "index.html", "changelog.html", "about.html"]);
    document.querySelectorAll(".updated").forEach((el) => { el.textContent = formatDate(LAST_UPDATED); });
    document.getElementById("log").replaceChildren(...CHANGELOG.map((entry) => {
      const tr = document.createElement("tr");
      const th = document.createElement("th");
      th.textContent = formatDate(entry.date);
      const ul = document.createElement("ul");
      ul.append(...entry.items.map((text) => Object.assign(document.createElement("li"), { textContent: text })));
      const td = document.createElement("td");
      td.append(ul);
      tr.append(th, td);
      return tr;
    }));
  </script>
</body>
</html>
